<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Marcelo Farías, Software Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Hugo Marcelo Farías, Software Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1226"/>
      <stop offset="1" stop-color="#101a3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glowR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#3b4a75" stroke-opacity="0.22" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1280" height="360" fill="url(#gridFade)"/></mask>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace; }
    .flow { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
    .cur  { animation: blink 1.1s steps(1) infinite; }
    @keyframes flow  { to { stroke-dashoffset: -28; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .flow, .cur { animation: none; } }
  </style>

  <!-- Fondo -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)" mask="url(#gridMask)"/>
  <circle cx="1020" cy="190" r="300" fill="url(#glowR)"/>
  <circle cx="120" cy="60" r="260" fill="url(#glowL)"/>

  <!-- Texto -->
  <text x="70" y="108" class="mono" font-size="18" fill="#6b7ba3">// Córdoba, Argentina</text>
  <text x="70" y="188" class="sans" font-size="78" font-weight="800" fill="#f0f6fc" letter-spacing="-1.5">Marcelo Farías</text>
  <rect x="72" y="204" width="120" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="70" y="256" class="sans" font-size="32" font-weight="500" fill="#9fb0d6">Software Developer<tspan class="cur mono" fill="#22d3ee">_</tspan></text>

  <!-- Tecnologías -->
  <g class="mono" font-size="16" fill="#cbd5f5" text-anchor="middle">
    <rect x="70"  y="288" width="82"  height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#4a5b8c"/>
    <text x="111" y="310">React</text>
    <rect x="164" y="288" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#4a5b8c"/>
    <text x="214" y="310">Next.js</text>
    <rect x="276" y="288" width="100" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#4a5b8c"/>
    <text x="326" y="310">Node.js</text>
    <rect x="388" y="288" width="126" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#4a5b8c"/>
    <text x="451" y="310">TypeScript</text>
    <rect x="526" y="288" width="126" height="34" rx="17" fill="#ffffff" fill-opacity="0.04" stroke="#4a5b8c"/>
    <text x="589" y="310">Blockchain</text>
  </g>

  <!-- Red de bloques -->
  <g fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round">
    <line class="flow" x1="850" y1="245" x2="1010" y2="125"/>
    <line class="flow" x1="1010" y1="125" x2="1160" y2="245"/>
    <line class="flow" x1="850" y1="245" x2="1160" y2="245" stroke="#5b6fb0" stroke-opacity="0.7"/>
  </g>

  <g class="mono" font-size="34" font-weight="700" text-anchor="middle">
    <rect x="795" y="190" width="110" height="110" rx="22" fill="#0d1630" stroke="url(#accent)" stroke-width="2.5"/>
    <text x="850" y="256" fill="#22d3ee">&lt;/&gt;</text>

    <rect x="955" y="70" width="110" height="110" rx="22" fill="#0d1630" stroke="url(#accent)" stroke-width="2.5"/>
    <text x="1010" y="136" fill="#a78bfa">{ }</text>

    <rect x="1105" y="190" width="110" height="110" rx="22" fill="#0d1630" stroke="url(#accent)" stroke-width="2.5"/>
    <text x="1160" y="256" fill="#67e8f9">0x</text>
  </g>

</svg>
